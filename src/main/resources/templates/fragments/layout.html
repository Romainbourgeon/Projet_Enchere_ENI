<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, header, content, footer, ressourcesSupp, bodyClass)">
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, header,content, footer, ressourcesSupp)"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${title}">Titre par défaut</title>

    <link rel="icon" th:href="@{/images/logo.png}" sizes="32x32">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <th:block th:replace="${ressourcesSupp}"></th:block>
    <!-- Injection CSS / ressources supplémentaires -->

</head>
<body th:class="${bodyClass}">
<div th:replace="${header}"></div>

    <nav>
        <img data-th-src="@{/images/logo.png}" alt="Logo marteau">
        <p>Les objets sont nos amis</p>
        <ul>
            <li><a data-th-href="@{/accueil}">Accueil</a></li>
            <th:block data-th-if="${!#authorization.expression('isAuthenticated()')}">
                <li><a data-th-href="@{/inscription}">S'inscrire</a></li>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <li><a data-th-href="@{/articles/ajouter}">Vendre un article</a></li>
            </th:block>
            <th:block  sec:authorize="isAuthenticated()">
                <li><a data-th-href="@{/logout}" >Se déconnecter</a></li>
            </th:block>
            <th:block  sec:authorize="isAuthenticated()">
                <li><a data-th-href="@{/profil}" >Profil</a></li>
            </th:block>
            <th:block data-th-if="${!#authorization.expression('isAuthenticated()')}">
                <li><a data-th-href="@{/connexion}" >Se connecter</a></li>
            </th:block>
        </ul>
        <div class="date-encadre">
            <div th:text="${dateDuJour}"></div>
            <!-- La date s'affichera ici -->
            <th:block  sec:authorize="isAuthenticated()">
                <p data-th-text="${#authentication.name}"></p>
            </th:block>
        </div>
    </nav>

<!-- On injecte le contenu spécifique de chaque page -->
<div th:replace="${content}"></div>

<div th:replace="${footer}"></div>

<footer class="text-center text-muted py-3 mt-5 border-top">
    &copy; 2025 Les objets sont nos amis. Tous droits réservés.
</footer>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const trailLength = 30; // Nombre de particules dans la trainée
        const trailElements = [];

        // Créer les éléments de la trainée
        for (let i = 0; i < trailLength; i++) {
            const trail = document.createElement('div');
            trail.className = 'trail';
            document.body.appendChild(trail);
            trailElements.push(trail);

            // Style initial (invisible)
            trail.style.opacity = 0;
            trail.style.transform = 'translate(-50%, -50%) scale(0)';
        }

        let index = 0;

        document.addEventListener('mousemove', function(e) {
            // Mettre à jour la position de la particule actuelle
            const trail = trailElements[index];
            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';
            trail.style.opacity = '0.6';
            trail.style.transform = 'translate(-50%, -50%) scale(1)';

            // Réinitialiser la particule après un court délai
            setTimeout(() => {
                trail.style.opacity = '0';
                trail.style.transform = 'translate(-50%, -50%) scale(0)';
            }, 100);

            // Passer à la particule suivante
            index = (index + 1) % trailLength;
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/marteau" data-th-href="@{/images/marteau.png}" />
    <title data-th-text="${pageTitle}">Accueil - Les Objets sont nos amis</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Votre CSS personnalisé (après Bootstrap pour override) -->
    <link rel="stylesheet" data-th-href="@{/css/layout.css}">
</head>

<body>
<div data-th-fragment="layout(title, content)">

    <!-- Header avec logo -->
    <header class="bg-dark text-white py-2">
        <div class="container-fluid">
            <img src="/images/marteau.png" alt="logo marteau" style="height: 40px;">
        </div>
    </header>

    <!-- Menu de navigation -->
    <div data-th-replace="fragments/fragment-header :: header"></div>

    <!-- Contenu principal -->
    <main class="container mt-4">
        <div data-th-insert="${content}"></div>
    </main>

    <!-- Pied de page -->
    <div data-th-replace="fragments/fragment-footer :: footer"></div>

</div>
</body>
</html>

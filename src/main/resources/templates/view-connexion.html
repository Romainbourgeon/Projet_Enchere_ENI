<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
        'Accueil - Les objets sont nos amis',
        ~{},
        ~{::content},
        ~{},
        ~{}
      )}">

<!-- Ce fragment sera injecté dans le layout à la place de ~{::content} -->
<div data-th-fragment="content">
    <main>
        <h1>Connexion</h1>

        <form method="post" th:action="@{/connexion}">
            <label for="pseudo">Email :</label><br>
            <input type="text" id="pseudo" name="username" required><br><br>

            <label for="password">Mot de passe :</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">Se connecter</button>
        </form>
    </main>
</div>
</html>
